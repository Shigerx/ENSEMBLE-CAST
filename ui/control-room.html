<style>
body {
  margin: 0;
  background: linear-gradient(180deg, #0c1222 0%, #0a0f1a 100%);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Panel styling */
.cr-panel {
  background: #111827;
  border: 1px solid #1e3a5f;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}
.cr-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,.3), transparent);
  pointer-events: none;
}

/* Panel header */
.panel-header {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #00d4ff;
  opacity: 0.7;
  padding: 12px 16px 8px;
  border-bottom: 1px solid rgba(30,58,95,.5);
  font-family: 'JetBrains Mono', monospace;
}

/* Status dot animations */
@keyframes pulse-active {
  0%, 100% { opacity: 1; box-shadow: 0 0 4px currentColor; }
  50% { opacity: 0.5; box-shadow: 0 0 8px currentColor; }
}
.dot-active {
  animation: pulse-active 2s ease-in-out infinite;
}
@keyframes pulse-blocked {
  0%, 100% { opacity: 1; box-shadow: 0 0 4px #ef4444; }
  50% { opacity: 0.5; box-shadow: 0 0 12px #ef4444; }
}
.dot-blocked {
  animation: pulse-blocked 1.5s ease-in-out infinite;
}

/* Progress bar */
@keyframes bar-scan {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.progress-fill-cr {
  background: linear-gradient(90deg, #00d4ff, #22c55e, #00d4ff);
  background-size: 200% 100%;
  animation: bar-scan 4s linear infinite;
  border-radius: 2px;
}

/* Live feed / timeline entry animation */
@keyframes feed-enter {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}
.feed-entry {
  animation: feed-enter 0.3s ease-out both;
}

/* Command console */
.console-input {
  background: rgba(0,212,255,.03);
  border: 1px solid rgba(0,212,255,.15);
  caret-color: #00d4ff;
}
.console-input:focus {
  border-color: rgba(0,212,255,.4);
  background: rgba(0,212,255,.05);
  outline: none;
  box-shadow: 0 0 12px rgba(0,212,255,.1);
}

/* Scanline overlay */
.scanline-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,.03) 2px,
    rgba(0,0,0,.03) 4px
  );
}

/* Loading */
@keyframes loading-glow {
  0%, 100% { text-shadow: 0 0 20px rgba(0,212,255,.3); }
  50% { text-shadow: 0 0 40px rgba(0,212,255,.7); }
}
.loading-title { animation: loading-glow 2s ease-in-out infinite; }

/* SSE status indicator */
@keyframes sse-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.sse-connected { color: #22c55e; animation: sse-pulse 3s ease-in-out infinite; }
.sse-disconnected { color: #ef4444; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,212,255,.15); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,212,255,.3); }

/* Branch folder toggle */
.branch-folder { cursor: pointer; user-select: none; }
.branch-folder:hover { background: rgba(0,212,255,.05); }

/* ─── STAGE: Card animations (v3) ─── */

/* Active card pulse (green glow) */
@keyframes card-active-pulse {
  0%, 100% { box-shadow: 0 0 8px rgba(34,197,94,.2); }
  50% { box-shadow: 0 0 16px rgba(34,197,94,.4); }
}
.stage-card-active {
  border-color: #22c55e;
  box-shadow: 0 0 12px rgba(34,197,94,.3);
  animation: card-active-pulse 2s ease-in-out infinite;
}

/* Thinking card (blue glow) */
@keyframes card-thinking-pulse {
  0%, 100% { box-shadow: 0 0 6px rgba(96,165,250,.2); }
  50% { box-shadow: 0 0 14px rgba(96,165,250,.35); }
}
.stage-card-thinking {
  border-color: #60a5fa;
  animation: card-thinking-pulse 2s ease-in-out infinite;
}

/* Typing dots for thinking state */
@keyframes typing-dot-1 {
  0%, 20% { opacity: 0.2; }
  40% { opacity: 1; }
  60%, 100% { opacity: 0.2; }
}
@keyframes typing-dot-2 {
  0%, 33% { opacity: 0.2; }
  53% { opacity: 1; }
  73%, 100% { opacity: 0.2; }
}
@keyframes typing-dot-3 {
  0%, 46% { opacity: 0.2; }
  66% { opacity: 1; }
  86%, 100% { opacity: 0.2; }
}
.typing-dots span:nth-child(1) { animation: typing-dot-1 1.4s ease-in-out infinite; }
.typing-dots span:nth-child(2) { animation: typing-dot-2 1.4s ease-in-out infinite; }
.typing-dots span:nth-child(3) { animation: typing-dot-3 1.4s ease-in-out infinite; }

/* Flash gold on completion */
@keyframes flash-gold {
  0% { border-color: #f0c040; box-shadow: 0 0 20px rgba(240,192,64,.5); }
  100% { border-color: #1e3a5f; box-shadow: none; }
}
.stage-card-done {
  animation: flash-gold 1.5s ease-out forwards;
}

/* Blocked card pulse (red glow) */
@keyframes card-blocked-pulse {
  0%, 100% { box-shadow: 0 0 8px rgba(239,68,68,.2); }
  50% { box-shadow: 0 0 18px rgba(239,68,68,.45); }
}
.stage-card-blocked {
  border-color: #ef4444;
  animation: card-blocked-pulse 1.5s ease-in-out infinite;
}

/* Idle card */
.stage-card-idle {
  opacity: 0.4;
  transform: scale(0.95);
}

/* Speech bubble */
@keyframes bubble-enter {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.speech-bubble {
  animation: bubble-enter 0.3s ease-out both;
}

/* ─── TIMELINE: Dividers & banners (v3) ─── */

.timeline-divider {
  height: 1px;
  margin: 8px 0;
  pointer-events: none;
}
.divider-gold {
  background: linear-gradient(90deg, transparent, rgba(240,192,64,.4), transparent);
}
.divider-green {
  background: linear-gradient(90deg, transparent, rgba(34,197,94,.3), transparent);
}
.divider-red {
  background: linear-gradient(90deg, transparent, rgba(239,68,68,.3), transparent);
}

/* Timeline banner (task_done, review, phase_complete) */
@keyframes banner-slide-in {
  from { opacity: 0; transform: translateX(-12px); }
  to { opacity: 1; transform: translateX(0); }
}
.timeline-banner {
  animation: banner-slide-in 0.4s ease-out both;
  border-radius: 4px;
  padding: 6px 10px;
  margin: 4px 0;
}

/* Ability flash */
@keyframes ability-flash {
  0% { box-shadow: 0 0 0 rgba(250,204,21,0); }
  30% { box-shadow: 0 0 12px rgba(250,204,21,.3); }
  100% { box-shadow: 0 0 0 rgba(250,204,21,0); }
}
.timeline-ability {
  animation: ability-flash 0.8s ease-out both;
}

/* ─── Alert Bar (v3) ─── */

@keyframes alert-slide-in {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes alert-fade-out {
  from { opacity: 1; }
  to { opacity: 0; transform: translateY(-50%); }
}
.alert-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  animation: alert-slide-in 0.3s ease-out;
  font-family: 'JetBrains Mono', monospace;
}
.alert-bar-resolved {
  animation: alert-fade-out 0.5s ease-out forwards;
}

/* ─── Phase Complete Ceremony (v3 Phase 3) ─── */

@keyframes phase-flash {
  0% { background: rgba(255,255,255,.3); }
  100% { background: transparent; }
}
.phase-complete-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.phase-complete-overlay canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
@keyframes phase-title-enter {
  0% { opacity: 0; transform: scale(0.7); letter-spacing: .6em; }
  40% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 1; transform: scale(1); letter-spacing: .3em; }
}
@keyframes phase-title-exit {
  0% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-20px); }
}
.phase-complete-title {
  font-size: 2.5rem;
  color: #f0c040;
  letter-spacing: .3em;
  text-shadow: 0 0 40px rgba(240,192,64,.5), 0 0 80px rgba(240,192,64,.2);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  text-transform: uppercase;
  z-index: 201;
  animation: phase-title-enter 0.8s ease-out both;
}
.phase-complete-title.exiting,
.phase-complete-subtitle.exiting {
  animation: phase-title-exit 0.5s ease-in forwards;
}
.phase-complete-subtitle {
  font-size: 1rem;
  color: rgba(240,192,64,.6);
  letter-spacing: .2em;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 8px;
  z-index: 201;
  animation: phase-title-enter 0.8s ease-out 0.2s both;
}

/* ─── Micro progress bar for tasks (v3 Phase 3) ─── */

.micro-progress-bar {
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,.05);
  overflow: hidden;
  flex-shrink: 0;
}
.micro-progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease-out;
}
.micro-progress-fill.status-done {
  background: #22c55e;
}
.micro-progress-fill.status-in-progress {
  background: linear-gradient(90deg, #00d4ff, #22c55e);
}
.micro-progress-fill.status-assigned {
  background: #00d4ff;
}
.micro-progress-fill.status-in-review {
  background: linear-gradient(90deg, #22c55e, #f0c040);
}
.micro-progress-fill.status-pending {
  background: rgba(255,255,255,.1);
}

/* ─── Git stats footer (v3 Phase 3) ─── */

.git-stats-footer {
  border-top: 1px solid rgba(30,58,95,.5);
  padding: 8px 16px;
  font-family: 'JetBrains Mono', monospace;
}

/* ─── Unit group (v3 Phase 4 skeleton) ─── */

.unit-group {
  border: 1px solid rgba(30,58,95,.3);
  border-radius: 6px;
  padding: 8px;
}
.unit-group-header {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(0,212,255,.5);
  font-family: 'JetBrains Mono', monospace;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(30,58,95,.2);
  margin-bottom: 8px;
}
</style>

<body class="text-cr-text font-sans">
<div class="scanline-overlay"></div>
<div id="app"></div>

<script>
const { h, render } = preact;
const { useState, useEffect, useRef, useCallback, useMemo } = preactHooks;
const html = htm.bind(h);

// ─── Constants ───
const FEED_EVENTS = new Set([
  'chat','progress','ability','task_done','phase_complete',
  'arrival','task_blocked','task_assign','review',
]);

// v3: Extended state map for STAGE card animations
const STAGE_STATE_MAP = {
  '\u51e6\u7406\u4e2d':   { label:'\u7a3c\u50cd\u4e2d',  cardCls:'stage-card-active',   dotIcon:'\u25cf', dotColor:'#22c55e' },
  '\u8d77\u52d5\u4e2d':   { label:'\u8003\u3048\u4e2d',  cardCls:'stage-card-thinking', dotIcon:'\u25cf', dotColor:'#60a5fa' },
  '\u5b8c\u4e86\u5f85\u6a5f': { label:'\u5b8c\u4e86\uff01',  cardCls:'stage-card-done',    dotIcon:'\u2728', dotColor:'#f0c040' },
  'blocked':  { label:'blocked', cardCls:'stage-card-blocked',  dotIcon:'\u26a0\ufe0f', dotColor:'#ef4444' },
};
const DEF_STAGE_STATE = { label:'\u5f85\u6a5f\u4e2d', cardCls:'stage-card-idle', dotIcon:'\u25cb', dotColor:'#6b7280' };

// v2 compat state map (for MissionPanel dot display)
const STATE_MAP = {
  '\u51e6\u7406\u4e2d':  { label:'\u7a3c\u50cd', cls:'bg-cr-active dot-active', icon:'\u25cf' },
  '\u8d77\u52d5\u4e2d':  { label:'\u8d77\u52d5', cls:'bg-blue-400 dot-active', icon:'\u25cf' },
  '\u5b8c\u4e86\u5f85\u6a5f':{ label:'\u5f85\u6a5f', cls:'bg-cr-idle', icon:'\u25cb' },
  'blocked': { label:'blocked', cls:'bg-cr-alert dot-blocked', icon:'\u25c9' },
};
const DEF_STATE = { label:'\u505c\u6b62', cls:'bg-gray-600', icon:'\u25cb' };

// v3: Event priority & styling for timeline
const EVENT_STYLE = {
  phase_complete: { priority: 4, icon: '\ud83c\udf89', bg: 'rgba(240,192,64,.08)', border: 'rgba(240,192,64,.3)', divider: 'divider-gold', label: 'Phase Complete' },
  ability:        { priority: 3, icon: '\u26a1',       bg: 'rgba(250,204,21,.06)', border: 'rgba(250,204,21,.25)', divider: null, label: null },
  task_done:      { priority: 3, icon: '\u2705',       bg: 'rgba(34,197,94,.06)',  border: 'rgba(34,197,94,.25)',  divider: 'divider-green', label: null },
  task_blocked:   { priority: 3, icon: '\u26a0\ufe0f', bg: 'rgba(239,68,68,.08)', border: 'rgba(239,68,68,.3)',  divider: 'divider-red', label: null },
  review:         { priority: 3, icon: '\u26a0\ufe0f', bg: 'rgba(239,68,68,.06)', border: 'rgba(239,68,68,.25)', divider: 'divider-red', label: null },
  task_assign:    { priority: 2, icon: '\ud83d\udccb',  bg: 'rgba(0,212,255,.04)', border: 'rgba(0,212,255,.15)', divider: null, label: null },
  arrival:        { priority: 2, icon: '\ud83c\udfac',  bg: 'rgba(0,212,255,.04)', border: 'rgba(0,212,255,.15)', divider: null, label: null },
  progress:       { priority: 1, icon: '\ud83d\udd27',  bg: null, border: null, divider: null, label: null },
  chat:           { priority: 0, icon: null,            bg: null, border: null, divider: null, label: null },
};

const api = (u) => fetch(u).then(r => {
  if(!r.ok) { console.warn(`[ControlRoom] ${u} returned ${r.status}`); return null; }
  return r.json();
}).catch(ex => { console.warn(`[ControlRoom] ${u} failed:`, ex.message); return null; });

// ─── SSE with exponential backoff (v3: status_change added) ───
function useSSE(onEvent, onDashboard, onRoster, onStatusChange) {
  const [connected, setConnected] = useState(false);
  const retryRef = useRef(1000);
  const esRef = useRef(null);
  const onEventRef = useRef(onEvent);
  const onDashboardRef = useRef(onDashboard);
  const onRosterRef = useRef(onRoster);
  const onStatusChangeRef = useRef(onStatusChange);
  onEventRef.current = onEvent;
  onDashboardRef.current = onDashboard;
  onRosterRef.current = onRoster;
  onStatusChangeRef.current = onStatusChange;

  useEffect(() => {
    let destroyed = false;
    let timer = null;

    function connect() {
      if(destroyed) return;
      const es = new EventSource('/api/events');
      esRef.current = es;

      es.addEventListener('activity', e => {
        try {
          retryRef.current = 1000;
          setConnected(true);
          const entry = JSON.parse(e.data);
          onEventRef.current(entry);
        } catch(ex) { console.warn('[ControlRoom] SSE parse error:', ex.message); }
      });

      es.addEventListener('dashboard', e => {
        try {
          const data = JSON.parse(e.data);
          if(onDashboardRef.current) onDashboardRef.current(data);
        } catch(ex) { console.warn('[ControlRoom] dashboard parse error:', ex.message); }
      });

      es.addEventListener('roster', e => {
        try {
          const data = JSON.parse(e.data);
          if(onRosterRef.current) onRosterRef.current(data);
        } catch(ex) { console.warn('[ControlRoom] roster parse error:', ex.message); }
      });

      // v3: status_change event
      es.addEventListener('status_change', e => {
        try {
          const data = JSON.parse(e.data);
          if(onStatusChangeRef.current) onStatusChangeRef.current(data);
        } catch(ex) { console.warn('[ControlRoom] status_change parse error:', ex.message); }
      });

      es.onopen = () => {
        retryRef.current = 1000;
        setConnected(true);
      };

      es.onerror = () => {
        es.close();
        setConnected(false);
        if(destroyed) return;
        const delay = retryRef.current;
        console.warn(`[ControlRoom] SSE disconnected, retry in ${delay}ms`);
        timer = setTimeout(connect, delay);
        retryRef.current = Math.min(retryRef.current * 2, 30000);
      };
    }

    connect();
    return () => {
      destroyed = true;
      if(timer) clearTimeout(timer);
      if(esRef.current) esRef.current.close();
    };
  }, []);

  return connected;
}

// ─── App (v3: alert bar + StagePanel + TimelinePanel) ───
function App() {
  const [cast, setCast] = useState([]);
  const [phases, setPhases] = useState({ current_phase: 0, phases: [] });
  const [tasks, setTasks] = useState([]);
  const [production, setProd] = useState({});
  const [feed, setFeed] = useState([]);
  const [loading, setLoading] = useState(true);
  // v3: alert bar state
  const [alerts, setAlerts] = useState([]);
  // v3 Phase 3: git stats
  const [gitStats, setGitStats] = useState(null);
  // v3 Phase 3: phase complete ceremony
  const [phaseCompleteVisible, setPhaseCompleteVisible] = useState(false);
  const [phaseCompleteNum, setPhaseCompleteNum] = useState(0);
  // v3 Phase 4: scale mode (small/large)
  const [scaleMode, setScaleMode] = useState('small');

  // Initial fetch
  useEffect(() => {
    Promise.all([
      api('/api/cast'), api('/api/phases'), api('/api/tasks'),
      api('/api/production'), api('/api/activity?limit=50'),
      api('/api/stats'),
    ]).then(([c, ph, tk, pr, act, st]) => {
      if(c) setCast(c.cast || []);
      if(ph) setPhases(ph);
      if(tk) setTasks(tk.tasks || []);
      if(pr) {
        setProd(pr);
        if(pr.scale) setScaleMode(pr.scale);
      }
      if(act) setFeed((act.entries || []).filter(e => FEED_EVENTS.has(e.event)).slice(-50));
      if(st) setGitStats(st);
      setLoading(false);
    });
  }, []);

  // SSE handlers
  const handleSSE = useCallback((entry) => {
    if(FEED_EVENTS.has(entry.event)) {
      setFeed(prev => [...prev, entry].slice(-100));
    }
    // v3: detect blocked/resolved for alert bar via activity events
    if(entry.event === 'task_blocked') {
      setAlerts(prev => {
        const existing = prev.find(a => a.slug === entry.actor);
        if(existing) return prev;
        return [...prev, {
          slug: entry.actor,
          message: entry.message || 'blocked',
          type: 'blocked',
          time: Date.now()
        }];
      });
    }
    // v3 Phase 3: phase_complete ceremony
    if(entry.event === 'phase_complete') {
      const phaseNum = entry.phase || phases.current_phase || 0;
      setPhaseCompleteNum(phaseNum);
      setPhaseCompleteVisible(true);
      setTimeout(() => setPhaseCompleteVisible(false), 5000);
    }
  }, [phases.current_phase]);

  const handleDashboard = useCallback((data) => {
    if(data) setPhases(data);
  }, []);

  const handleRoster = useCallback((data) => {
    if(data && data.cast) setCast(data.cast);
  }, []);

  // v3: status_change handler
  const handleStatusChange = useCallback((data) => {
    if(!data || !data.slug) return;
    setCast(prev => prev.map(c => {
      if(c.slug !== data.slug) return c;
      return {
        ...c,
        state: data.state || c.state,
        task_title: data.task_title || c.task_title,
        task_id: data.task_id || c.task_id,
      };
    }));
  }, []);

  const sseConnected = useSSE(handleSSE, handleDashboard, handleRoster, handleStatusChange);

  // v3: sync alerts with cast blocked state
  useEffect(() => {
    const blockedSlugs = new Set(cast.filter(c => c.state === 'blocked').map(c => c.slug));
    // Add alerts for newly blocked cast
    blockedSlugs.forEach(slug => {
      setAlerts(prev => {
        if(prev.find(a => a.slug === slug && a.type === 'blocked')) return prev;
        const c = cast.find(cc => cc.slug === slug);
        return [...prev, {
          slug,
          message: (c && c.task_title) ? `${c.character_name || slug}: ${c.task_title}` : slug,
          type: 'blocked',
          time: Date.now()
        }];
      });
    });
    // Mark resolved alerts
    setAlerts(prev => prev.map(a => {
      if(a.type === 'blocked' && !blockedSlugs.has(a.slug) && !a.resolved) {
        return { ...a, resolved: true, resolvedTime: Date.now() };
      }
      return a;
    }));
  }, [cast]);

  // Remove resolved alerts after fade-out
  useEffect(() => {
    const resolved = alerts.filter(a => a.resolved);
    if(resolved.length === 0) return;
    const timer = setTimeout(() => {
      setAlerts(prev => prev.filter(a => !a.resolved));
    }, 600);
    return () => clearTimeout(timer);
  }, [alerts]);

  // Periodic refresh (every 5s) — v3 Phase 3: added /api/stats
  useEffect(() => {
    const iv = setInterval(() => {
      Promise.all([
        api('/api/cast'), api('/api/phases'), api('/api/tasks'),
        api('/api/stats'),
      ]).then(([c, ph, tk, st]) => {
        if(c) setCast(c.cast || []);
        if(ph) setPhases(ph);
        if(tk) setTasks(tk.tasks || []);
        if(st) setGitStats(st);
      });
    }, 5000);
    return () => clearInterval(iv);
  }, []);

  if(loading) return html`
    <div class="flex flex-col items-center justify-center min-h-screen gap-4">
      <div class="loading-title text-3xl font-light tracking-[.3em] text-cr-accent font-mono">
        CONTROL ROOM</div>
      <div class="text-sm text-cr-idle tracking-wider font-mono">Initializing systems...</div>
    </div>`;

  const curPhase = phases.phases.find(p => p.number === phases.current_phase);
  const totalDone = phases.phases.reduce((s, p) => s + p.tasks_done, 0);
  const totalAll = phases.phases.reduce((s, p) => s + p.tasks_total, 0);

  return html`
    <!-- v3: Alert Bar -->
    <${AlertBar} alerts=${alerts} cast=${cast} />

    <!-- v3 Phase 3: Phase Complete Ceremony -->
    ${phaseCompleteVisible ? html`
      <${PhaseCompleteCeremony} phaseNum=${phaseCompleteNum}
        onDone=${() => setPhaseCompleteVisible(false)} />
    ` : null}

    <div class="max-w-7xl mx-auto px-4 py-4 relative z-10">
      <!-- Top bar -->
      <${TopBar} production=${production} phase=${phases.current_phase}
                 sseConnected=${sseConnected} />

      <!-- v3 Phase 3 layout: Left sidebar (STAGE + MISSION + COMMAND) / Right (TIMELINE) -->
      <div class="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-4 mt-4">

        <!-- Left column -->
        <div class="flex flex-col gap-4">
          <${StagePanel} cast=${cast} scaleMode=${scaleMode} />
          <${MissionPanel} phases=${phases} tasks=${tasks} cast=${cast}
                           curPhase=${curPhase} totalDone=${totalDone} totalAll=${totalAll}
                           gitStats=${gitStats} scaleMode=${scaleMode} />
          <${CommandConsole} />
        </div>

        <!-- Right column -->
        <div class="flex flex-col gap-4">
          <${TimelinePanel} feed=${feed} cast=${cast} />
        </div>
      </div>

      <div class="text-center text-cr-idle/40 text-xs mt-6 pb-6 font-mono">
        ENSEMBLE CAST Control Room v3.1
        <span class="mx-1">\u00b7</span>
        <a href="/theater"
           class="text-cr-idle/40 hover:text-cr-accent transition-colors no-underline"
           style="text-decoration:none"
           >\ud83c\udfac Theater \u2192</a>

  assigned: 25,
  in_progress: 50,
  in_review: 80,
  approved: 100,
  done: 100,

  // Filter tasks for current phase

    if(!curPhase) return tasks || [];
    return (tasks || []).filter(t =>
      t.phase === curPhase.number || t.phase === phases.current_phase
    );
  }, [tasks, curPhase, phases.current_phase]);

  // If no phase filter works, show all tasks
  const displayTasks = phaseTasks.length > 0 ? phaseTasks : (tasks || []);

  // v3 Phase 4: group tasks by unit (skeleton — uses cast.unit if available)
  const unitGroupedTasks = useMemo(() => {

      const unit = (c && c.unit) || 'default';

      groups[unit].total++;
      if(t.status === 'done' || t.status === 'approved') groups[unit].done++;

// ─── Git Stats Footer (v3 Phase 3) ───
function GitStatsFooter({ stats }) {
  if(!stats) return null;

  const relTime = useMemo(() => {
    if(!stats.last_merge) return null;
    const now = Date.now();
    const mergeTime = new Date(stats.last_merge).getTime();
    if(isNaN(mergeTime)) return null;
    const diffMs = now - mergeTime;
    const diffMin = Math.floor(diffMs / 60000);
    if(diffMin < 1) return 'just now';
    if(diffMin < 60) return `${diffMin}min ago`;
    const diffH = Math.floor(diffMin / 60);
    if(diffH < 24) return `${diffH}h ago`;
    return `${Math.floor(diffH / 24)}d ago`;
  }, [stats.last_merge]);

  const commits = stats.commits_today || 0;
  const activeBranches = stats.active_branches || 0;

  return html`
    <div class="git-stats-footer">
      <div class="flex items-center gap-1 text-[10px] text-cr-text/30 flex-wrap">
        <span class="text-cr-text/20">Git:</span>
        <span>${commits} commit${commits !== 1 ? 's' : ''} today</span>
        <span class="text-cr-text/15">|</span>
        <span>${activeBranches} branch${activeBranches !== 1 ? 'es' : ''} active</span>
        ${relTime ? html`
          <span class="text-cr-text/15">|</span>
          <span>last merge ${relTime}</span>
        ` : null}
      </div>
    </div>`;
}

// ─── Phase Complete Ceremony (v3 Phase 3) ───
function PhaseCompleteCeremony({ phaseNum, onDone }) {
  const canvasRef = useRef(null);
  const [exiting, setExiting] = useState(false);

  useEffect(() => {
    // 1. Flash effect (handled by CSS)
    // 2. Gold particle rain on canvas
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const PARTICLE_COUNT = 80;

    for(let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -Math.random() * canvas.height * 0.5,
        vx: (Math.random() - 0.5) * 2,
        vy: Math.random() * 3 + 1.5,
        size: Math.random() * 4 + 2,
        opacity: Math.random() * 0.7 + 0.3,
        hue: 40 + Math.random() * 20, // gold range
      });
    }

    let animId;
    let startTime = Date.now();

    function animate() {
      const elapsed = Date.now() - startTime;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fade out after 2.5s
      const globalAlpha = elapsed > 2500 ? Math.max(0, 1 - (elapsed - 2500) / 500) : 1;

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.02; // gravity
        p.vx += (Math.random() - 0.5) * 0.1; // drift

        ctx.save();
        ctx.globalAlpha = p.opacity * globalAlpha;
        ctx.fillStyle = `hsl(${p.hue}, 80%, 60%)`;
        ctx.shadowColor = `hsl(${p.hue}, 80%, 60%)`;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      if(elapsed < 3000) {
        animId = requestAnimationFrame(animate);
      }
    }

    animate();

    // 3. Start exit after 3.5s, fully hide at 5s
    const exitTimer = setTimeout(() => setExiting(true), 3500);
    const doneTimer = setTimeout(() => { if(onDone) onDone(); }, 5000);

    return () => {
      if(animId) cancelAnimationFrame(animId);
      clearTimeout(exitTimer);
      clearTimeout(doneTimer);
    };
  }, [onDone]);

  return html`
    <div class="phase-complete-overlay"
         style="animation: phase-flash 0.6s ease-out both">
      <canvas ref=${canvasRef}></canvas>
      <div class="phase-complete-title ${exiting ? 'exiting' : ''}">
        Phase ${phaseNum}</div>
      <div class="phase-complete-subtitle ${exiting ? 'exiting' : ''}">
        COMPLETE</div>
    </div>`;
}

          return html`

            ${isPhaseComplete ? html`

                   style="background: rgba(240,192,64,.08); border: 1px solid rgba(240,192,64,.25)">
                <div class="flex items-center gap-2">
                  <span class="text-lg">\ud83c\udf89</span>
                  <div class="flex-1">
                    <div class="text-xs font-medium text-yellow-400/90 font-mono">
                      Phase Complete</div>
                    <div class="text-[11px] text-cr-text/50 mt-0.5">${e.message || ''}</div>
                  </div>
                  <span class="text-[10px] text-cr-text/25 font-mono">${time}</span>
                </div>
              </div>
            ` : isBanner ? html`
              <!-- High priority banner (task_done, task_blocked, review, ability) -->
              <div class="timeline-banner feed-entry ${isAbility ? 'timeline-ability' : ''}"
                   style="background: ${evStyle.bg || 'transparent'}; border: 1px solid ${evStyle.border || 'transparent'}">
                <div class="flex items-center gap-2">
                  <span class="text-[10px] text-cr-text/25 font-mono w-10 flex-shrink-0">${time}</span>
                  <span class="text-sm flex-shrink-0">${evStyle.icon || ''}</span>
                  <span class="text-sm flex-shrink-0">${isDir ? '\ud83c\udfac' : c.emoji || '\ud83d\udc64'}</span>
                  <div class="min-w-0 flex-1">
                    <span class="text-[11px] font-medium mr-1.5"
                          style="color:${isDir ? '#6b7280' : c.color}">
                      ${isDir ? 'Director' : c.name}</span>
                    <span class="text-[11px] text-cr-text/70">${e.message || ''}</span>
                    ${isAbility && e.ability_name ? html`
                      <span class="ml-1 text-[10px] text-yellow-400/80 font-mono">\u300e${e.ability_name}\u300f</span>
                    ` : null}
                  </div>
                </div>
              </div>
            ` : html`
              <!-- Normal event (chat, progress, task_assign, arrival) -->
              <div key=${(e.timestamp||'') + i}
                   class="feed-entry flex gap-2 py-1.5 px-2 rounded hover:bg-white/[.02] transition-colors"
                   style="animation-delay:${Math.max(0, i - feed.length + 5) * 0.05}s">
                <span class="text-[10px] text-cr-text/25 font-mono w-10 flex-shrink-0 pt-0.5">${time}</span>
                ${evStyle.icon ? html`
                  <span class="text-xs flex-shrink-0 w-4 text-center opacity-50">${evStyle.icon}</span>
                ` : null}
                <span class="text-sm flex-shrink-0 w-5 text-center">${isDir ? '\ud83c\udfac' : c.emoji || '\ud83d\udc64'}</span>
                <div class="min-w-0 flex-1">
                  <span class="text-[11px] font-medium mr-1.5"
                        style="color:${isDir ? '#6b7280' : c.color}">
                    ${isDir ? 'Director' : c.name}</span>
                  <span class="text-[11px] ${isDir ? 'text-cr-text/30 italic' : 'text-cr-text/60'}">
                    ${e.message || ''}</span>
                </div>
              </div>
            `}

            <!-- Divider after high-priority events -->
            ${divCls ? html`<div class="timeline-divider ${divCls}"></div>` : null}
          `;
        })}
      </div>
      ${!autoScroll ? html`
        <div class="px-3 pb-2">
          <button onClick=${() => { setAutoScroll(true); if(feedRef.current) feedRef.current.scrollTop = feedRef.current.scrollHeight; }}
                  class="w-full text-[10px] text-cr-accent/50 hover:text-cr-accent/80 font-mono
                         py-1 border border-cr-accent/10 rounded transition-colors">
            \u2193 Scroll to latest</button>
        </div>
      ` : null}
    </div>`;
}

function fmtTime(ts) {
  if(!ts) return '';
  const m = ts.match(/(\d{2}):(\d{2})/);
  return m ? m[1] + ':' + m[2] : '';
}

// ─── COMMAND CONSOLE ───
const CMD_LABELS = { sending: '...', ok: '\u2713', err: '\u00d7' };

function CommandConsole() {
  const [msg, setMsg] = useState('');
  const [status, setStatus] = useState(null);
  const [errMsg, setErrMsg] = useState('');
  const [history, setHistory] = useState([]);

  const send = useCallback(async () => {
    if(!msg.trim()) return;
    setStatus('sending');
    setErrMsg('');
    const sent = msg.trim();
    try {
      const r = await fetch('/api/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: sent }),
      });
      const d = await r.json();
      if(d.success) {
        setHistory(prev => [...prev, { text: sent, ok: true, time: new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' }) }].slice(-10));
        setMsg('');
        setStatus('ok');
      } else {
        setStatus('err');
        setErrMsg(d.error || '\u9001\u4fe1\u5931\u6557');
      }
    } catch(ex) {
      console.warn('[ControlRoom] message send failed:', ex.message);
      setStatus('err');
      setErrMsg('\u30b5\u30fc\u30d0\u30fc\u63a5\u7d9a\u30a8\u30e9\u30fc');
    }
    setTimeout(() => setStatus(null), 2000);
  }, [msg]);

  const onKey = useCallback(e => {
    if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }, [send]);

  return html`
    <div class="cr-panel">
      <div class="panel-header">Command Console</div>
      <div class="p-3">
        <!-- History -->
        ${history.length > 0 ? html`
          <div class="mb-3 space-y-1 max-h-[120px] overflow-y-auto">
            ${history.map((h, i) => html`
              <div key=${i} class="flex items-center gap-2 text-[10px]">
                <span class="text-cr-text/20 font-mono">${h.time}</span>
                <span class="text-cr-accent/30 font-mono">&gt;</span>
                <span class="text-cr-text/30 truncate">${h.text}</span>
                <span class="${h.ok ? 'text-cr-active/50' : 'text-cr-alert/50'}">${h.ok ? '\u2713' : '\u00d7'}</span>
              </div>
            `)}
          </div>
        ` : null}
        <!-- Input -->
        <div class="flex gap-2 items-center">
          <span class="text-cr-accent/40 font-mono text-sm">&gt;</span>
          <input type="text" value=${msg}
            onInput=${e => setMsg(e.target.value)} onKeyDown=${onKey}
            placeholder="Producer\u306b\u6307\u793a..."
            class="console-input flex-1 rounded px-3 py-2 text-sm text-cr-text/80
                   placeholder-cr-text/20 font-mono transition" />
          <button onClick=${send}
            disabled=${!msg.trim() || status === 'sending'}
            class="px-4 py-2 rounded text-xs font-mono font-medium transition
                   ${msg.trim()
                     ? 'bg-cr-accent/10 text-cr-accent/80 hover:bg-cr-accent/20 border border-cr-accent/20'
                     : 'bg-white/[.02] text-cr-text/20 cursor-not-allowed border border-white/5'}">
            ${CMD_LABELS[status] || '\u9001\u4fe1'}
          </button>
        </div>
        ${status === 'err' && errMsg ? html`
          <div class="text-[10px] text-cr-alert/60 mt-1.5 font-mono">\u26a0 ${errMsg}</div>
        ` : null}
      </div>
    </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
