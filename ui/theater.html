<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENSEMBLE CAST — Theater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { fontFamily: { sans: ['"Noto Sans JP"','system-ui','sans-serif'] } } }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/preact@10/dist/preact.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/preact@10/hooks/dist/hooks.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3/dist/htm.umd.js"></script>
<style>
body { margin:0; background:linear-gradient(180deg,#0a0a0f 0%,#10101c 40%,#12121a 100%);
       min-height:100vh; overflow-x:hidden; }

/* Vignette overlay */
#app::after { content:''; position:fixed; inset:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.55) 100%);
  pointer-events:none; z-index:50; }

/* Screen panel */
.screen { position:relative;
  background:linear-gradient(180deg,#1a1a2e,#1c1c32 40%,#1a1a2e);
  border:1px solid rgba(240,192,64,.10); border-radius:8px;
  box-shadow:0 0 60px rgba(240,192,64,.03),0 0 120px rgba(240,192,64,.015),
             0 8px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.03); }
.screen::before { content:''; position:absolute; inset:-1px; border-radius:9px;
  background:linear-gradient(180deg,rgba(240,192,64,.06),transparent 30%,transparent 70%,rgba(240,192,64,.03));
  pointer-events:none; z-index:1; }

/* Light leak beneath screen */
.light-leak { height:50px;
  background:radial-gradient(ellipse at 50% 0%,rgba(240,192,64,.06),transparent 70%);
  filter:blur(20px); }

/* Loading */
@keyframes fade-in { from{opacity:0} to{opacity:1} }
@keyframes title-glow { 0%,100%{text-shadow:0 0 20px rgba(240,192,64,.3)}
  50%{text-shadow:0 0 40px rgba(240,192,64,.6)} }
.loading-title { animation:fade-in 1s ease-out,title-glow 2s ease-in-out infinite; }

/* Episode list item hover */
.ep-item { transition:all .3s ease; cursor:pointer; }
.ep-item:hover:not(.ep-locked) { background:rgba(240,192,64,.06); border-color:rgba(240,192,64,.18); }
.ep-locked { cursor:not-allowed; opacity:.5; }

/* Scene animations */
@keyframes scene-fade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.scene-enter { animation:scene-fade .6s ease-out both; }

@keyframes beat-slide { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
.beat-enter { animation:beat-slide .5s ease-out both; }

@keyframes narration-fade { from{opacity:0} to{opacity:1} }
.narration-enter { animation:narration-fade 1s ease-out both; }

@keyframes direction-fade { from{opacity:0} to{opacity:.6} }
.direction-enter { animation:direction-fade .4s ease-out both; }

@keyframes fin-fade { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
.fin-enter { animation:fin-fade 1.5s ease-out both; }

/* Gold accent line */
.gold-line { height:1px; background:linear-gradient(90deg,transparent,#f0c040,transparent); }

/* Scene divider dots */
.scene-break { color:#f0c040; opacity:.3; letter-spacing:.6em; }

/* Progress bar shine */
@keyframes bar-shine { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
.progress-fill { background:linear-gradient(90deg,#f0c040,#f5d060,#f0c040);
  background-size:200% 100%; animation:bar-shine 3s ease-in-out infinite; border-radius:2px; }

/* Scrollbar */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:2px; }

/* Back link hover */
.back-link { transition:all .2s; }
.back-link:hover { color:#f0c040; }

/* Nav button */
.nav-btn { transition:all .2s; }
.nav-btn:hover:not(:disabled) { background:rgba(240,192,64,.08); border-color:rgba(240,192,64,.2); }
.nav-btn:disabled { opacity:.3; cursor:not-allowed; }

/* Play button pulse */
@keyframes play-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(240,192,64,.3)} 50%{box-shadow:0 0 0 8px rgba(240,192,64,0)} }
.play-btn { animation:play-pulse 2.5s ease-in-out infinite; }
</style>
</head>

<body class="text-white font-sans">
<div id="app"></div>

<script>
const { h, render } = preact;
const { useState, useEffect, useRef, useCallback, useMemo } = preactHooks;
const html = htm.bind(h);

// ─── Demo / Fallback Data ───
const DEMO_CAST = [
  { slug: 'giorno', character_name: 'ジョルノ', emoji: '🌟', color: '#f0c040' },
  { slug: 'bucciarati', character_name: 'ブチャラティ', emoji: '🔵', color: '#4a9eff' },
  { slug: 'narancia', character_name: 'ナランチャ', emoji: '✈️', color: '#ff6b35' },
  { slug: 'mista', character_name: 'ミスタ', emoji: '🔫', color: '#8b5cf6' },
  { slug: 'abbacchio', character_name: 'アバッキオ', emoji: '👮', color: '#6b7280' },
];

const DEMO_EPISODES = [
  { number: 1, title: "初期化の風", synopsis: "プロジェクト初期化。Astro + Cloudflare Pages の構築に挑む", scene_count: 3, status: "available" },
  { number: 2, title: "基盤という名の覚悟", synopsis: "基盤構築。テスト環境とCI/CDを整える", scene_count: 4, status: "available" },
  { number: 3, title: "コア機能の鎮魂歌", synopsis: "コア機能実装。APIルートとデータ層の設計に立ち向かう", scene_count: 5, status: "available" },
  { number: 4, title: "守りの哲学", synopsis: "セキュリティとバリデーション。堅牢な防御を築く", scene_count: 3, status: "available" },
  { number: 5, title: "フォームとR2の邂逅", synopsis: "フォーム実装とCloudflare R2ストレージ連携", scene_count: 4, status: "available" },
  { number: 6, title: "黄金の風、デプロイに吹く", synopsis: "UI改修とデプロイを同時進行。最終調整に挑む", scene_count: 6, status: "available" },
  { number: 7, title: null, synopsis: null, scene_count: 0, status: "recording" },
];

const DEMO_EPISODE_DETAIL = {
  episode: 1, title: "初期化の風",
  synopsis: "プロジェクト初期化。Astro + Cloudflare Pages の構築に挑む",
  scenes: [
    {
      scene: 1, title: "作戦開始",
      narration: "新しいプロジェクトの幕が上がる。チームは未知の技術スタックに挑もうとしていた。",
      beats: [
        { character: "bucciarati", action: "タスクボードを見据えて", dialogue: "全員、持ち場につけ。今回は時間との戦いだ" },
        { character: "giorno", action: "静かに立ち上がる", dialogue: "トップページは僕が引き受けます。...これが、僕の『覚悟』です" },
        { character: "narancia", action: "拳を握りしめて", dialogue: "おれはJSON-LDってやつをやるぜ！ボラーレ・ヴィーア！" },
      ]
    },
    {
      scene: 2, title: "Astro の洗礼",
      narration: "Astro 5.17 の設定ファイルが、予想外の壁となって立ちはだかる。Content Collections の型定義が、まるで暗号のように複雑だった。",
      beats: [
        { character: "mista", action: "エラーログを睨みつけて", dialogue: "くそっ...型エラーが4つ出てやがる...4はダメだってのによぉ...！" },
        { character: "abbacchio", action: "冷静にコンソールを確認する", dialogue: "...落ち着け。エラーメッセージを一つずつ読め。答えは必ずそこにある" },
        { character: "mista", action: "深呼吸して再挑戦", dialogue: "...わかった。tsconfig から見直す" },
      ]
    },
    {
      scene: 3, title: "最初の光",
      narration: "localhost:4321 にアクセスした瞬間、画面に光が灯る。小さな一歩だが、確かな前進だった。",
      beats: [
        { character: "giorno", action: "モニターに映る画面を見て微笑む", dialogue: "見えますか、ブチャラティ。これが僕たちの最初の一歩です" },
        { character: "bucciarati", action: "静かに頷く", dialogue: "ああ...いい出だしだ。だが、本当の戦いはこれからだ" },
        { character: "narancia", action: "画面を指さして", dialogue: "おお！動いてるぜ！マジで動いてる！" },
      ]
    }
  ]
};

const DEMO_PRODUCTION = {
  project_name: "F.L.A.R.E.",
  movie_title: "ジョジョの奇妙な冒険 黄金の風",
};

// ─── Utilities ───
const safeColor = (c) => /^#[0-9a-fA-F]{3,8}$/.test(c) ? c : '#888';

// ─── API Helper ───
const api = (u) => fetch(u).then(r => {
  if(!r.ok) { console.warn(`[Theater] ${u} returned ${r.status}`); return null; }
  return r.json();
}).catch(ex => { console.warn(`[Theater] ${u} failed:`, ex.message); return null; });

// ─── App ───
function App() {
  const [view, setView] = useState('list');       // 'list' | 'play'
  const [episodes, setEpisodes] = useState(null);  // null = loading
  const [production, setProduction] = useState(null);
  const [castMap, setCastMap] = useState({});
  const [currentEp, setCurrentEp] = useState(null);
  const [epDetail, setEpDetail] = useState(null);
  const [loading, setLoading] = useState(true);
  const [epLoading, setEpLoading] = useState(false);

  // Initial data fetch
  useEffect(() => {
    Promise.all([
      api('/api/episodes'),
      api('/api/production'),
      api('/api/cast'),
    ]).then(([epData, prodData, castData]) => {
      // Episodes
      if (epData && epData.episodes) {
        setEpisodes(epData.episodes);
      } else {
        setEpisodes(DEMO_EPISODES);
      }

      // Production (single source of truth, priority: /api/production > epData.production > demo)
      if (prodData) {
        setProduction(prodData);
      } else if (epData && epData.production) {
        setProduction({ movie_title: epData.production });
      } else {
        setProduction(DEMO_PRODUCTION);
      }

      // Cast map (slug -> { emoji, name, color })
      const map = {};
      if (castData && castData.cast) {
        castData.cast.forEach(c => {
          map[c.slug] = { emoji: c.emoji || '', name: c.character_name || c.slug, color: safeColor(c.color) };
        });
      } else {
        DEMO_CAST.forEach(c => {
          map[c.slug] = { emoji: c.emoji, name: c.character_name, color: c.color };
        });
      }
      setCastMap(map);
    }).finally(() => {
      setLoading(false);
    });
  }, []);

  // Play an episode
  const playEpisode = useCallback(async (num) => {
    setEpLoading(true);
    setCurrentEp(num);
    setView('play');

    const data = await api(`/api/episodes/${num}`);
    if (data && data.scenes) {
      setEpDetail(data);
    } else {
      // Fallback: use demo detail for ep1, or generate minimal placeholder
      if (num === 1) {
        setEpDetail(DEMO_EPISODE_DETAIL);
      } else {
        const ep = (episodes || DEMO_EPISODES).find(e => e.number === num);
        setEpDetail({
          episode: num,
          title: ep ? ep.title : `Episode ${num}`,
          synopsis: ep ? ep.synopsis : '',
          scenes: [{
            scene: 1, title: "Coming Soon",
            narration: "このエピソードの脚本はまだ生成されていません。",
            beats: []
          }]
        });
      }
    }
    setEpLoading(false);
  }, [episodes]);

  // Back to list
  const backToList = useCallback(() => {
    setView('list');
    setCurrentEp(null);
    setEpDetail(null);
  }, []);

  // Play latest available episode
  const playLatest = useCallback(() => {
    const available = (episodes || []).filter(e => e.status === 'available');
    if (available.length > 0) {
      playEpisode(available[available.length - 1].number);
    }
  }, [episodes, playEpisode]);

  // Loading screen
  if (loading) return html`
    <div class="flex flex-col items-center justify-center min-h-screen gap-4 relative z-10">
      <div class="loading-title text-3xl font-light tracking-[.3em] text-[#f0c040]">ENSEMBLE CAST</div>
      <div class="text-sm text-gray-500 tracking-wider">Theater Loading...</div>
    </div>`;

  return html`
    <div class="relative z-10">
      ${view === 'list'
        ? html`<${EpisodeList}
            episodes=${episodes}
            production=${production}
            onPlay=${playEpisode}
            onPlayLatest=${playLatest} />`
        : html`<${EpisodePlayer}
            epDetail=${epDetail}
            epLoading=${epLoading}
            episodes=${episodes}
            castMap=${castMap}
            currentEp=${currentEp}
            onBack=${backToList}
            onPlay=${playEpisode} />`
      }
    </div>`;
}

// ─── Episode List ───
function EpisodeList({ episodes, production, onPlay, onPlayLatest }) {
  const available = (episodes || []).filter(e => e.status === 'available');
  const hasAvailable = available.length > 0;

  return html`
    <div class="max-w-3xl mx-auto px-4 py-8 md:py-16">
      <!-- Header -->
      <div class="text-center mb-10">
        <div class="text-[10px] tracking-[.5em] uppercase text-[#f0c040]/50 mb-3">
          Ensemble Cast presents</div>
        <h1 class="text-2xl md:text-3xl font-light tracking-wider text-[#f0c040] mb-1"
            style="text-shadow:0 0 30px rgba(240,192,64,.2)">
          ENSEMBLE CAST THEATER</h1>
        <div class="h-px w-32 mx-auto my-4 bg-gradient-to-r from-transparent via-[#f0c040]/30 to-transparent"></div>
        ${production && html`
          <div class="space-y-1">
            <div class="text-base md:text-lg font-light text-white/80 tracking-wide">
              ${production.movie_title || ''}</div>
            ${production.project_name && html`
              <div class="text-xs text-white/30 tracking-widest uppercase">
                ${'× ' + production.project_name}</div>`}
          </div>`}
      </div>

      <!-- Episode List -->
      <div class="screen p-5 md:p-8 mb-6">
        <div class="relative z-10 space-y-2">
          ${(episodes || []).map(ep => html`
            <${EpisodeItem} key=${ep.number} ep=${ep} onPlay=${onPlay} />
          `)}
          ${(!episodes || episodes.length === 0) && html`
            <div class="text-center text-white/20 py-8 italic">
              エピソードがありません</div>`}
        </div>
      </div>

      <div class="light-leak"></div>

      <!-- Play Latest Button -->
      ${hasAvailable && html`
        <div class="text-center mt-8">
          <button onClick=${onPlayLatest}
            class="play-btn inline-flex items-center gap-3 px-8 py-3 rounded-full
                   bg-[#f0c040]/10 border border-[#f0c040]/20
                   text-[#f0c040] text-sm font-medium tracking-wide
                   hover:bg-[#f0c040]/15 hover:border-[#f0c040]/30 transition-all">
            <span>最新エピソードを再生</span>
            <span class="text-lg">▶</span>
          </button>
        </div>`}

      <!-- Footer -->
      <div class="text-center text-gray-700 text-xs mt-10 pb-8">
        ENSEMBLE CAST Theater v2.0</div>
    </div>`;
}

// ─── Episode Item ───
function EpisodeItem({ ep, onPlay }) {
  const isRecording = ep.status === 'recording';
  const isAvailable = ep.status === 'available';

  return html`
    <div onClick=${() => isAvailable && onPlay(ep.number)}
         class="ep-item ${isRecording ? 'ep-locked' : ''}
                flex items-center gap-4 px-4 py-3 rounded-lg
                border border-white/5 bg-white/[.02]">
      <!-- Episode number -->
      <div class="flex-shrink-0 w-14 text-right">
        <span class="text-[#f0c040]/70 text-sm font-medium">EP.${ep.number}</span>
      </div>

      <!-- Title + Synopsis -->
      <div class="flex-1 min-w-0">
        ${isRecording
          ? html`<div class="text-white/30 text-sm flex items-center gap-2">
              <span>🔒</span>
              <span class="italic">撮影中...</span>
            </div>`
          : html`
            <div class="text-white/80 text-sm font-medium truncate">${ep.title || 'Untitled'}</div>
            ${ep.synopsis && html`
              <div class="text-white/30 text-xs mt-0.5 truncate">${ep.synopsis}</div>`}`
        }
      </div>

      <!-- Scene count + Play -->
      ${isAvailable && html`
        <div class="flex-shrink-0 flex items-center gap-3">
          <span class="text-[10px] text-white/20">${ep.scene_count} scenes</span>
          <span class="text-[#f0c040]/60 text-lg hover:text-[#f0c040] transition-colors">▶</span>
        </div>`}
    </div>`;
}

// ─── Episode Player ───
function EpisodePlayer({ epDetail, epLoading, episodes, castMap, currentEp, onBack, onPlay }) {
  const scrollRef = useRef(null);

  // Navigation
  const allEps = episodes || [];
  const currentIdx = allEps.findIndex(e => e.number === currentEp);
  const prevEp = currentIdx > 0 ? allEps[currentIdx - 1] : null;
  const nextEp = currentIdx < allEps.length - 1 ? allEps[currentIdx + 1] : null;
  const prevAvailable = prevEp && prevEp.status === 'available';
  const nextAvailable = nextEp && nextEp.status === 'available';

  // Scroll to top on episode change
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = 0;
    window.scrollTo(0, 0);
  }, [currentEp]);

  // Loading state
  if (epLoading || !epDetail) return html`
    <div class="max-w-3xl mx-auto px-4 py-8">
      <div class="flex flex-col items-center justify-center py-20 gap-4">
        <div class="loading-title text-xl font-light tracking-[.2em] text-[#f0c040]/60">
          LOADING...</div>
      </div>
    </div>`;

  const isFinalScene = (idx) => idx === epDetail.scenes.length - 1;

  return html`
    <div ref=${scrollRef} class="max-w-3xl mx-auto px-4 py-6 md:py-10">
      <!-- Back button -->
      <button onClick=${onBack}
        class="back-link flex items-center gap-2 text-white/40 text-sm mb-6 hover:text-[#f0c040]">
        <span>◀</span>
        <span>エピソード一覧</span>
      </button>

      <!-- Episode title -->
      <div class="screen p-6 md:p-10 mb-0">
        <div class="relative z-10">
          <!-- Episode header -->
          <div class="mb-8">
            <div class="text-[10px] tracking-[.4em] uppercase text-[#f0c040]/40 mb-2">
              Episode ${epDetail.episode}</div>
            <h2 class="text-xl md:text-2xl font-light text-white/90 tracking-wide">
              EP.${epDetail.episode} — ${epDetail.title}</h2>
            <div class="gold-line mt-4 opacity-40"></div>
            ${epDetail.synopsis && html`
              <div class="text-sm text-white/30 mt-3 italic">${epDetail.synopsis}</div>`}
          </div>

          <!-- Scenes -->
          <div class="space-y-10">
            ${epDetail.scenes.map((scene, si) => html`
              <${SceneBlock}
                key=${scene.scene}
                scene=${scene}
                castMap=${castMap}
                index=${si}
                isFinal=${isFinalScene(si)}
                totalScenes=${epDetail.scenes.length} />
            `)}
          </div>

          <!-- FIN -->
          <div class="mt-12 mb-4">
            <div class="gold-line opacity-60"></div>
            <div class="fin-enter text-center py-8">
              <div class="text-xs tracking-[.5em] text-[#f0c040]/40 mb-2 uppercase">
                Episode ${epDetail.episode}</div>
              <div class="text-xl font-light text-[#f0c040]/80 tracking-[.4em]"
                   style="text-shadow:0 0 20px rgba(240,192,64,.2)">
                FIN</div>
            </div>
          </div>

          <!-- Episode navigation -->
          <div class="flex items-center justify-between pt-4 border-t border-white/5">
            <div>
              ${prevEp ? html`
                <button onClick=${() => prevAvailable && onPlay(prevEp.number)}
                  disabled=${!prevAvailable}
                  class="nav-btn flex items-center gap-2 px-4 py-2 rounded-lg
                         border border-white/5 text-sm text-white/50">
                  <span>◀</span>
                  <span>EP.${prevEp.number}</span>
                </button>` : html`<div></div>`}
            </div>

            <!-- Progress bar -->
            <div class="flex-1 mx-6">
              <div class="h-1 bg-white/5 rounded-full overflow-hidden">
                <div class="progress-fill h-full" style="width:100%"></div>
              </div>
              <div class="text-[10px] text-white/20 text-center mt-1">完</div>
            </div>

            <div>
              ${nextEp ? html`
                <button onClick=${() => nextAvailable && onPlay(nextEp.number)}
                  disabled=${!nextAvailable}
                  class="nav-btn flex items-center gap-2 px-4 py-2 rounded-lg
                         border border-white/5 text-sm text-white/50">
                  <span>EP.${nextEp.number}${nextEp.status === 'recording' ? ' (🔒)' : ''}</span>
                  <span>▶</span>
                </button>` : html`<div></div>`}
            </div>
          </div>
        </div>
      </div>

      <div class="light-leak"></div>

      <!-- Footer -->
      <div class="text-center text-gray-700 text-xs mt-8 pb-8">
        ENSEMBLE CAST Theater v2.0</div>
    </div>`;
}

// ─── Scene Block ───
function SceneBlock({ scene, castMap, index, isFinal, totalScenes }) {
  const sceneLabel = isFinal && totalScenes > 1
    ? `FINAL SCENE — ${scene.title}`
    : `SCENE ${scene.scene} — ${scene.title}`;

  return html`
    <div class="scene-enter" style="animation-delay:${index * 0.15}s">
      <!-- Scene header -->
      <div class="mb-4">
        <div class="text-sm font-medium tracking-wide
                    ${isFinal ? 'text-[#f0c040]/80' : 'text-white/60'}">
          ${sceneLabel}</div>
        <div class="h-px mt-2 ${isFinal
          ? 'bg-gradient-to-r from-transparent via-[#f0c040]/30 to-transparent'
          : 'bg-white/5'}"
             style="border-top:1px dashed ${isFinal ? 'rgba(240,192,64,.2)' : 'rgba(255,255,255,.06)'}">
        </div>
      </div>

      <!-- Narration -->
      ${scene.narration && html`
        <div class="narration-enter text-[#a0aec0] italic text-sm leading-relaxed mb-6 pl-2"
             style="animation-delay:${index * 0.15 + 0.2}s">
          ${scene.narration}
        </div>`}

      <!-- Beats -->
      <div class="space-y-5 pl-2 md:pl-6">
        ${(scene.beats || []).map((beat, bi) => html`
          <${BeatBlock}
            key=${'beat-' + index + '-' + bi}
            beat=${beat}
            castMap=${castMap}
            animDelay=${index * 0.15 + 0.3 + bi * 0.12} />
        `)}
      </div>

      <!-- Scene break -->
      ${!isFinal && html`
        <div class="text-center mt-8">
          <span class="scene-break text-sm select-none">---- ☕ ----</span>
        </div>`}
    </div>`;
}

// ─── Beat Block ───
function BeatBlock({ beat, castMap, animDelay }) {
  // Narration beat (no character)
  if (beat.narration || (!beat.character && !beat.dialogue)) {
    const text = beat.narration || beat.dialogue || '';
    return html`
      <div class="narration-enter text-[#a0aec0] italic text-sm leading-relaxed"
           style="animation-delay:${animDelay}s">
        ${text}
      </div>`;
  }

  const raw = castMap[beat.character] || { emoji: '👤', name: beat.character || '???', color: '#888' };
  const cast = { ...raw, color: safeColor(raw.color) };

  return html`
    <div class="beat-enter" style="animation-delay:${animDelay}s">
      <!-- Character name + action -->
      <div class="flex items-center gap-2 mb-1">
        <span class="text-base">${cast.emoji}</span>
        <span class="text-sm font-medium" style="color:${cast.color}">
          ${cast.name}:</span>
        ${beat.action && html`
          <span class="direction-enter text-xs text-[#6b7280] italic">
            (${beat.action})</span>`}
      </div>

      <!-- Dialogue -->
      ${beat.dialogue && html`
        <div class="pl-8 text-sm text-white/85 leading-relaxed"
             style="text-shadow:0 1px 8px rgba(0,0,0,.5)">
          「${beat.dialogue}」
        </div>`}
    </div>`;
}

// ─── Render ───
render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
