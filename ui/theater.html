<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENSEMBLE CAST — Theater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { fontFamily: { sans: ['"Noto Sans JP"','system-ui','sans-serif'] } } }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/preact@10/dist/preact.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/preact@10/hooks/dist/hooks.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3/dist/htm.umd.js"></script>
<style>
body { margin:0; background:linear-gradient(180deg,#07070c 0%,#0c0c14 40%,#0f0f18 100%);
       min-height:100vh; overflow-x:hidden; }
#app::after { content:''; position:fixed; inset:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.5) 100%);
  pointer-events:none; z-index:50; }

/* Screen */
.screen { position:relative;
  background:linear-gradient(180deg,#111122,#161630 40%,#1a1a32);
  border:1px solid rgba(240,192,64,.12); border-radius:6px;
  box-shadow:0 0 40px rgba(240,192,64,.04),0 0 80px rgba(240,192,64,.02),
             0 4px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04); }
.screen::before { content:''; position:absolute; inset:-1px; border-radius:7px;
  background:linear-gradient(180deg,rgba(240,192,64,.08),transparent 30%,transparent 70%,rgba(240,192,64,.04));
  pointer-events:none; z-index:1; }

/* Light leak */
.light-leak { height:40px;
  background:radial-gradient(ellipse at 50% 0%,rgba(240,192,64,.07),transparent 70%);
  filter:blur(16px); }

/* Subtitles */
@keyframes sub-enter { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
.sub-line { animation:sub-enter .5s ease-out both;
  text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.6); }

/* Film strip */
.film-strip { position:relative; background:#14141e; border-radius:4px;
  border:1px solid rgba(255,255,255,.04); }
.sprocket-row { display:flex; gap:16px; justify-content:center; padding:0 24px; }
.sprocket { width:10px; height:6px; background:#07070c; border-radius:1px; flex-shrink:0; }

/* Seat cards */
.seat-card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06);
  border-radius:8px; transition:all .3s; }
.seat-card:hover { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.1); }

/* Status dot */
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }
.dot-active { animation:pulse-dot 2s ease-in-out infinite; }

/* Progress bar */
@keyframes bar-shine { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
.progress-fill { background:linear-gradient(90deg,#f0c040,#f5d060,#f0c040);
  background-size:200% 100%; animation:bar-shine 3s ease-in-out infinite; border-radius:2px; }

/* Loading */
@keyframes fade-in { from{opacity:0} to{opacity:1} }
@keyframes title-glow { 0%,100%{text-shadow:0 0 20px rgba(240,192,64,.3)}
  50%{text-shadow:0 0 40px rgba(240,192,64,.6)} }
.loading-title { animation:fade-in 1s ease-out,title-glow 2s ease-in-out infinite; }

/* Ability glow */
@keyframes ability-glow {
  0%   { box-shadow:0 0 0 rgba(var(--glow),0); }
  30%  { box-shadow:0 0 20px rgba(var(--glow),.5),0 0 40px rgba(var(--glow),.2); }
  100% { box-shadow:0 0 0 rgba(var(--glow),0); }
}
.ability-active { animation:ability-glow 2s ease-out; }

/* Branch tree */
@keyframes branch-pulse { 0%,100%{opacity:.7} 50%{opacity:.3} }
.branch-active { animation:branch-pulse 2s ease-in-out infinite; }

/* Scrollbar */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:2px; }
</style>
</head>

<body class="text-white font-sans">
<div id="app"></div>

<script>
const { h, render } = preact;
const { useState, useEffect, useRef, useCallback } = preactHooks;
const html = htm.bind(h);

// ─── Constants ───
const COLORS = {
  giorno:'#f0c040', bucciarati:'#4a9eff', narancia:'#ff6b35',
  mista:'#8b5cf6', abbacchio:'#6b7280',
};
const SUB_EVENTS = new Set([
  'chat','progress','ability','task_done','phase_complete','arrival','task_blocked',
]);
const STATE_MAP = {
  '処理中':  { label:'処理中', dot:'bg-green-400 dot-active' },
  '起動中':  { label:'起動中', dot:'bg-blue-400 dot-active' },
  '完了待機':{ label:'待機',   dot:'bg-yellow-400' },
  'blocked': { label:'blocked',dot:'bg-red-400 dot-active' },
};
const DEF_STATE = { label:'停止', dot:'bg-gray-600' };

const api = (u) => fetch(u).then(r => {
  if(!r.ok) { console.warn(`[Theater] ${u} returned ${r.status}`); return null; }
  return r.json();
}).catch(ex => { console.warn(`[Theater] ${u} failed:`, ex.message); return null; });

// ─── App ───
function App() {
  const [cast, setCast] = useState([]);
  const [phases, setPhases] = useState({current_phase:0,phases:[]});
  const [production, setProd] = useState({});
  const [subs, setSubs] = useState([]);
  const [branches, setBranches] = useState([]);
  const [loading, setLoading] = useState(true);
  const [abilitySlug, setAbilitySlug] = useState(null);
  const abilityTimer = useRef(null);

  useEffect(() => {
    Promise.all([
      api('/api/cast'), api('/api/phases'), api('/api/production'),
      api('/api/activity?limit=20'), api('/api/branches'),
    ]).then(([c,ph,pr,act,br]) => {
      if(c) setCast(c.cast||[]);
      if(ph) setPhases(ph);
      if(pr) setProd(pr);
      if(act) setSubs((act.entries||[]).filter(e=>SUB_EVENTS.has(e.event)).slice(-4));
      if(br) setBranches(br.branches||[]);
      setLoading(false);
    });
  }, []);

  useEffect(() => {
    const es = new EventSource('/api/events');
    es.addEventListener('activity', e => {
      try {
        const entry = JSON.parse(e.data);
        if(SUB_EVENTS.has(entry.event))
          setSubs(prev => [...prev, entry].slice(-4));
        if(entry.event === 'ability') {
          setAbilitySlug(entry.actor);
          clearTimeout(abilityTimer.current);
          abilityTimer.current = setTimeout(()=>setAbilitySlug(null), 3000);
        }
      } catch(ex){ console.warn('[Theater] SSE parse error:', ex.message); }
    });
    return () => es.close();
  }, []);

  useEffect(() => {
    const iv = setInterval(() => {
      Promise.all([api('/api/cast'),api('/api/phases'),api('/api/branches')])
        .then(([c,ph,br]) => {
          if(c) setCast(c.cast||[]);
          if(ph) setPhases(ph);
          if(br) setBranches(br.branches||[]);
        });
    }, 5000);
    return () => clearInterval(iv);
  }, []);

  if(loading) return html`
    <div class="flex flex-col items-center justify-center min-h-screen gap-4">
      <div class="loading-title text-3xl font-light tracking-[.3em] text-[#f0c040]">ENSEMBLE CAST</div>
      <div class="text-sm text-gray-500 tracking-wider">Now Loading...</div>
    </div>`;

  const totalDone = phases.phases.reduce((s,p)=>s+p.tasks_done,0);
  const totalAll  = phases.phases.reduce((s,p)=>s+p.tasks_total,0);
  const overallPct = totalAll>0 ? Math.round(totalDone/totalAll*100) : 0;

  return html`
    <div class="max-w-5xl mx-auto px-4 py-6 relative z-10">
      <div class="screen p-6 md:p-8 mb-0">
        <!-- Header -->
        <div class="text-center mb-4 relative z-10">
          <div class="text-[10px] tracking-[.4em] uppercase text-[#f0c040]/60 mb-1">Ensemble Cast presents</div>
          <h1 class="text-lg md:text-xl font-light tracking-wider text-white/90">${production.movie_title||''}</h1>
          <div class="text-xs text-white/30 mt-1 tracking-wide">
            ${production.project_name ? `× ${production.project_name.toUpperCase()}`:''}</div>
        </div>

        <!-- Branch Tree -->
        <${BranchTree} branches=${branches} phases=${phases.phases} cast=${cast} />

        <!-- Progress -->
        <${ProgressBar} pct=${overallPct} done=${totalDone} total=${totalAll} phase=${phases.current_phase} />

        <div class="my-5 border-t border-white/5"></div>

        <!-- Subtitles -->
        <${Subtitles} entries=${subs} cast=${cast} />
      </div>

      <div class="light-leak"></div>
      <${FilmStrip} phases=${phases.phases} />
      <${SeatPanel} cast=${cast} abilitySlug=${abilitySlug} />
      <${AudienceInput} />
      <div class="text-center text-gray-700 text-xs mt-4 pb-8">🍿 ENSEMBLE CAST Theater v1.1</div>
    </div>`;
}

// ─── Branch Tree (SVG) ───
function BranchTree({ branches, phases, cast }) {
  if(!branches || branches.length === 0) return null;

  const byPhase = {};
  branches.forEach(b => {
    const p = b.phase || 1;
    if(!byPhase[p]) byPhase[p] = [];
    byPhase[p].push(b);
  });
  const phaseNums = Object.keys(byPhase).map(Number).sort((a,b)=>a-b);
  const PW = 160;          // phase column width
  const BH = 26;           // branch row height
  const MY = 28;           // main line Y
  const PX = 30;           // left padding
  const maxB = Math.max(...Object.values(byPhase).map(a=>a.length), 1);
  const W = phaseNums.length * PW + PX * 2;
  const H = MY + maxB * BH + 16;

  return html`
    <div class="overflow-x-auto mb-4 relative z-10 -mx-2 px-2">
      <svg viewBox="0 0 ${W} ${H}" class="w-full" style="min-width:${Math.min(W,600)}px">
        <!-- Main line -->
        <line x1="${PX}" y1="${MY}" x2="${W-PX}" y2="${MY}"
              stroke="#f0c040" stroke-width="2" opacity=".25" />
        <circle cx="${W-PX}" cy="${MY}" r="3" fill="#f0c040" opacity=".3" />

        ${phaseNums.map((pn, pi) => {
          const ox = PX + pi * PW;
          const tasks = byPhase[pn] || [];
          const allMerged = tasks.every(t=>t.status==='merged');
          return html`
            <g>
              <!-- Phase node on main -->
              <circle cx="${ox+12}" cy="${MY}" r="${allMerged?4:3}"
                      fill="${allMerged?'#f0c040':'none'}"
                      stroke="#f0c040" stroke-width="1.5" opacity="${allMerged?.5:.3}" />
              <text x="${ox+12}" y="${MY-10}" text-anchor="middle"
                    fill="#f0c040" opacity=".35" font-size="9"
                    font-family="Noto Sans JP,sans-serif">P${pn < 99 ? pn : ''}</text>

              <!-- Branches -->
              ${tasks.map((b, bi) => {
                const sx = ox + 24;
                const ex = ox + PW - 12;
                const y  = MY + (bi+1) * BH;
                const c  = b.color || '#888';
                const merged = b.status === 'merged';
                const active = b.status === 'in_progress' || b.status === 'assigned';
                const op = merged ? .3 : .7;

                return html`
                  <g class="${active?'branch-active':''}">
                    <!-- Fork curve -->
                    <path d="M${sx-12},${MY} C${sx-4},${MY} ${sx-4},${y} ${sx},${y}"
                          stroke="${c}" stroke-width="1.5" fill="none" opacity="${op}" />
                    <!-- Branch line -->
                    <line x1="${sx}" y1="${y}" x2="${ex}" y2="${y}"
                          stroke="${c}" stroke-width="1.5" opacity="${op}"
                          ${active?'stroke-dasharray="4 2"':''} />
                    <!-- Merge curve -->
                    ${merged ? html`
                      <path d="M${ex},${y} C${ex+8},${y} ${ex+8},${MY} ${ex+16},${MY}"
                            stroke="${c}" stroke-width="1" fill="none" opacity=".2" />
                      <circle cx="${ex+16}" cy="${MY}" r="2" fill="${c}" opacity=".25" />
                    ` : null}
                    <!-- End node -->
                    <circle cx="${ex}" cy="${y}" r="3"
                            fill="${merged?c:'none'}" stroke="${c}"
                            stroke-width="1.5" opacity="${merged?.4:.7}" />
                    <!-- Label -->
                    <text x="${sx+4}" y="${y-6}" fill="${c}"
                          opacity=".45" font-size="8"
                          font-family="Noto Sans JP,sans-serif">
                      #${b.task_id}
                    </text>
                  </g>`;
              })}
            </g>`;
        })}
      </svg>
    </div>`;
}

// ─── Progress Bar ───
function ProgressBar({pct,done,total,phase}) {
  return html`
    <div class="relative z-10">
      <div class="flex items-center justify-between text-[11px] mb-2">
        <span class="text-white/40">
          ${phase>0?`Phase ${phase}`:''} ${pct>=100?'完了':'上映中'}</span>
        <span class="text-white/40">
          ${done}/${total} tasks
          <span class="ml-2 text-[#f0c040]/80 font-medium">${pct}%</span></span>
      </div>
      <div class="h-1 bg-white/5 rounded-full overflow-hidden">
        <div class="progress-fill h-full transition-all duration-700" style="width:${pct}%"></div>
      </div>
    </div>`;
}

// ─── Subtitles ───
function Subtitles({entries,cast}) {
  const colors={}, emojis={}, names={};
  (cast||[]).forEach(c=>{
    colors[c.slug]=c.color||COLORS[c.slug]||'#fff';
    emojis[c.slug]=c.emoji||'';
    names[c.slug]=c.character_name||c.slug;
  });
  if(!entries||!entries.length) return html`
    <div class="min-h-[100px] flex items-center justify-center">
      <div class="text-white/20 text-sm italic">上映準備中...</div></div>`;
  return html`
    <div class="min-h-[100px] space-y-3">
      ${entries.map((e,i) => {
        const c=colors[e.actor]||'#888', emo=emojis[e.actor]||'', name=names[e.actor]||e.actor;
        const dir=e.actor==='DIRECTOR';
        return html`
          <div key=${e.timestamp+i} class="sub-line" style="animation-delay:${i*.08}s">
            <div class="flex items-center gap-2 mb-0.5">
              ${!dir&&emo&&html`<span class="text-sm">${emo}</span>`}
              <span class="text-[13px] font-medium" style="color:${dir?'#888':c}">
                ${dir?'🎬 Director':name}</span>
              <span class="text-[10px] text-white/20">${fmtTime(e.timestamp)}</span>
            </div>
            <div class="text-[13px] leading-relaxed pl-6 ${dir?'text-white/40 italic':'text-white/80'}">
              ${dir?e.message:`「${e.message}」`}</div>
          </div>`;
      })}
    </div>`;
}
function fmtTime(ts){ if(!ts)return''; const m=ts.match(/(\d{2}):(\d{2})/); return m?m[1]+':'+m[2]:''; }

// ─── Film Strip ───
function FilmStrip({phases}) {
  if(!phases||!phases.length) return null;
  const sp = Array(Math.max(phases.length*3,8)).fill(0);
  return html`
    <div class="film-strip my-4 py-2">
      <div class="sprocket-row mb-2">${sp.map(()=>html`<div class="sprocket"></div>`)}</div>
      <div class="flex gap-2 px-4 overflow-x-auto py-1">
        ${phases.map(p => {
          const done=p.status==='complete';
          return html`
            <div class="flex-shrink-0 w-28 rounded px-3 py-2 text-center
                        ${done?'bg-[#f0c040]/5 border border-[#f0c040]/10':'bg-white/[.02] border border-white/5'}">
              <div class="text-[10px] tracking-wider ${done?'text-[#f0c040]/60':'text-white/30'}">${p.name}</div>
              <div class="text-[11px] mt-1 ${done?'text-[#f0c040]/80':'text-white/50'}">
                ${done?'✅':'▶'} ${p.tasks_done}/${p.tasks_total}</div>
              <div class="h-0.5 mt-1.5 rounded-full overflow-hidden ${done?'bg-[#f0c040]/10':'bg-white/5'}">
                <div class="h-full rounded-full ${done?'bg-[#f0c040]/40':'bg-white/20'}"
                     style="width:${p.progress}%"></div></div>
            </div>`;
        })}
      </div>
      <div class="sprocket-row mt-2">${sp.map(()=>html`<div class="sprocket"></div>`)}</div>
    </div>`;
}

// ─── Seat Panel ───
function SeatPanel({cast, abilitySlug}) {
  if(!cast||!cast.length) return null;
  return html`
    <div class="mt-4">
      <div class="text-[10px] text-white/20 tracking-wider text-center mb-3 uppercase">🍿 Cast</div>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
        ${cast.map(c=>html`<${SeatCard} ...${c} isAbility=${abilitySlug===c.slug} />`)}
      </div>
    </div>`;
}

function SeatCard({slug,character_name,dev_role,emoji,color,state,
                    ability_name,task_id,task_title,isAbility}) {
  const s=STATE_MAP[state]||DEF_STATE;
  const clr=color||COLORS[slug]||'#888';
  // Convert hex to r,g,b for CSS variable
  const rgb = clr.match(/[\da-f]{2}/gi);
  const glowRGB = rgb ? rgb.map(h=>parseInt(h,16)).join(',') : '255,255,255';

  return html`
    <div class="seat-card p-3 group ${isAbility?'ability-active':''}"
         style="--glow:${glowRGB}">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-lg">${emoji||'👤'}</span>
        <div class="min-w-0">
          <div class="text-[13px] font-medium truncate" style="color:${clr}">
            ${character_name||slug}</div>
          <div class="text-[10px] text-white/30 truncate">${dev_role}</div>
        </div>
      </div>
      <div class="flex items-center gap-1.5 mb-1.5">
        <div class="w-1.5 h-1.5 rounded-full ${s.dot}"></div>
        <span class="text-[10px] text-white/40">${s.label}</span>
      </div>
      ${task_id?html`
        <div class="text-[10px] text-white/25 truncate" title=${task_title||''}>
          #${task_id} ${task_title||''}</div>`:null}
      ${ability_name?html`
        <div class="text-[10px] mt-1.5 truncate transition-opacity duration-300
                    ${isAbility?'opacity-100':'opacity-0 group-hover:opacity-100'}"
             style="color:${clr}">
          ⚡ ${ability_name}</div>`:null}
    </div>`;
}

// ─── Audience Input ───
const BTN_LABELS = {sending:'...', ok:'✓', err:'×'};

function AudienceInput() {
  const [msg, setMsg] = useState('');
  const [status, setStatus] = useState(null); // 'ok' | 'err' | 'sending'
  const [errMsg, setErrMsg] = useState('');

  const send = useCallback(async () => {
    if(!msg.trim()) return;
    setStatus('sending');
    setErrMsg('');
    try {
      const r = await fetch('/api/message', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message: msg.trim()}),
      });
      const d = await r.json();
      if(d.success) { setMsg(''); setStatus('ok'); }
      else { setStatus('err'); setErrMsg(d.error||'送信失敗'); }
    } catch(ex) {
      console.warn('[Theater] message send failed:', ex.message);
      setStatus('err');
      setErrMsg('サーバー接続エラー');
    }
    setTimeout(()=>setStatus(null), 2000);
  }, [msg]);

  const onKey = useCallback(e => { if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } }, [send]);

  return html`
    <div class="mt-6 px-2">
      <div class="text-[10px] text-white/15 tracking-wider text-center mb-2">🎬 客席</div>
      <div class="flex gap-2 items-center">
        <input type="text" value=${msg}
          onInput=${e=>setMsg(e.target.value)} onKeyDown=${onKey}
          placeholder="Producer に話しかける..."
          class="flex-1 bg-white/[.03] border border-white/[.06] rounded-lg px-4 py-2.5
                 text-sm text-white/80 placeholder-white/20 outline-none
                 focus:border-[#f0c040]/30 focus:bg-white/[.04] transition" />
        <button onClick=${send}
          disabled=${!msg.trim()||status==='sending'}
          class="px-4 py-2.5 rounded-lg text-sm font-medium transition
                 ${msg.trim()?'bg-[#f0c040]/10 text-[#f0c040]/80 hover:bg-[#f0c040]/20':'bg-white/[.02] text-white/20 cursor-not-allowed'}">
          ${BTN_LABELS[status]||'送信'}
        </button>
      </div>
      ${status==='err'&&errMsg?html`<div class="text-[10px] text-red-400/60 mt-1 text-center">
        ${errMsg}</div>`:null}
    </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
