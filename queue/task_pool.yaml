  - id: 46
    title: "パイプライン全面改修（日付注入 + プロンプト強化 + チャート改善）"
    priority: critical
    status: completed
    required_role: "バックエンドリード"
    depends_on: []
    description: |
      Gemini パイプラインの品質を大幅向上させる。src/lib/gemini.ts を改修。

      **1. 日付注入（最重要）**
      - TRIAGE_SYSTEM_PROMPT と RESEARCH_SYSTEM_PROMPT の冒頭に「本日の日付: {current_date}」を動的に挿入
      - Worker Consumer (worker/src/index.ts) で `new Date().toISOString().split('T')[0]` を取得し、プロンプトに渡す
      - 「来年」「最新」等の相対表現を正確に解決させる指示を追加

      **2. リサーチプロンプト強化（NotebookLM級を目指す）**
      - 調査の深さ: 各セクションに「なぜそうなるのか」「具体的な事例」「数値データ」を必須化
      - ソースの質: 「公式ドキュメント、学術論文、信頼性の高いメディアを優先」を明示
      - 構造: Executive Summary → Background → 詳細分析（3セクション以上）→ データ/チャート → 今後の展望 → 結論 → 参考文献
      - 文字数: 最低 5000 文字の本文を要求
      - 画像プレースホルダー: 各主要セクションの後に `![section_image_N](placeholder)` を挿入させる（N=0,1,2...）。
        最低3枚のプレースホルダーを要求

      **3. チャート改善**
      - チャートブロックに「このデータは本文のどのセクションに基づくか」を明記させる
      - 「ダミーデータ禁止。本文に記載した数値・比較データのみをチャート化すること」を強調
      - チャート種別の選択基準を明示: 比較→bar、推移→line、構成比→pie、多軸評価→radar

      **4. Grounding 強化**
      - complexity が "deep" でなくても、Google Search Grounding を常時有効化
      - 検索クエリの質を向上（プロンプトで「具体的な検索キーワードを3-5個指定」）

      **注意**: types.ts, db.ts は mista (#45) が変更中。images 関連の型変更は #45 に任せる。
      プロンプト文字列と gemini.ts 内の関数ロジックのみ変更すること。
    owned_files:
      - "src/lib/gemini.ts"
      - "worker/src/index.ts"
    shared_files:
      - "src/lib/types.ts"
      - "src/lib/db.ts"
