# ENSEMBLE CAST — Framework Feedback
# Cast/Director が ENSEMBLE-CAST フレームワーク自体の改善提案を記録するファイル
# Owner が次回フレームワーク開発者（Claude Code）を起動した際に参照される
#
# 書き込み: Director（Cast のレポートから集約）
# 読み: Owner + フレームワーク開発者
#
# status: open → acknowledged → resolved

feedback:
  - id: FB-001
    reporter: owner
    category: bug
    title: "show-live.sh の PROGRESS が常に50%表示になる"
    detail: |
      原因1: Director が queue/tasks/*.yaml の status を done/approved に更新しない。
      activity.log と dashboard.md は更新されるが task YAML は assigned/in_progress のまま放置される。
      原因2: show-live.sh の progress マッピングが assigned=50%, in_progress=50% で同一。
      配布〜完了まで見た目が変わらない。
      修正案: (A) Director が完了時に task YAML の status も更新するルールを追加、
      (B) show-live.sh のデータソースを dashboard.md か activity.log に変更、
      (C) マッピングに粒度を追加（assigned=30%, in_progress=50%, review=80%）
    impact: medium
    status: acknowledged
    resolution: |
      (A) director.md: task.yaml status 更新ルールを 🔴 強調に変更（見落とし防止）
      (B) show-live.sh: assigned=25%, in_progress=50% に分離（視覚的区別）
    timestamp: "2026-02-08T15:03:06"

  - id: FB-002
    reporter: owner
    category: friction
    title: "Design Debate のドラマが activity.log / chronicle に記録されない"
    detail: |
      Phase 9 開始時、Director が Design Debate Protocol（セクション22）を実行。
      Advocate / Challenger / Consultant を Task tool で逐次召喚し、20分以上かけて
      6つの論点と1つの重大発見（@tailwindcss/typography 未導入）を含む設計審議を行った。

      問題: この議論は queue/design/phase9_debate.md（720行）にファイルとして残るが、
      以下のチャネルには一切反映されない:
        - activity.log（Design Debate の開始・終了・重大発見がログされない）
        - Cast の chronicle（Cast は Debate に参加しないため記録なし）
        - dashboard.md（Debate 完了しても更新されない）

      結果: Episode 脚本を書く際、Debate の中身を「掘り起こす」必要がある。
      Season 1 ではドラマが全て表（Cast の行動→ログ→chronicle）で起きたが、
      Design Debate は Director の頭の中で完結するため、ドラマが水面下で消える。

      特に問題なのは:
        1. Challenger が設計の欠陥を6つ指摘した「対決」の緊迫感
        2. Consultant が prose クラス全無効を発見した「爆弾」の瞬間
        3. Director が Challenger の指摘を全面採用した「判断」の重み
      これらが全て不可視になること。

      もう一つの問題: Director が Debate を深追いしすぎて Cast への委任が遅れた。
      Debate 中に Cast 5人が全員 Idle で20分以上待機。「即時委任の原則」（セクション18）
      との折り合いが難しい。Debate は丁寧にやるべきだが、Cast を遊ばせるのはコスト。

      修正案:
        (A) director.md に「Debate 開始/終了/重大発見を activity.log に記録する」ルール追加
        (B) Debate ファイルに machine-readable なサマリーセクションを追加
            （脚本生成ツールが自動で拾える形式）
        (C) Debate と Cast 起床の並列化: Wave 1 のタスクが明確なら、
            Debate 完了前でも Cast にタスク概要を先行配布し、
            Debate 結論で微調整する「仮配布→確定」フロー
        (D) Debate の所要時間にガードレール設定（例: 15分以内。超過したら切り上げて配布）
    impact: high
    status: acknowledged
    resolution: |
      (A) director.md: Design Debate 実行フローに activity.log 記録ステップを追加。
      イベント3種: debate_start（開始）、debate_finding（重大発見）、debate_end（終了）。
      アドホック Debate にも同様のルールを追加。
      debate_finding の記録基準: 「脚本に使える」ドラマ的価値がある発見のみ（1 Debate あたり 0〜3 件）。
    timestamp: "2026-02-09T18:00:00"

  - id: FB-003
    reporter: owner
    category: suggestion
    title: "助監督（AD）導入によるパイプライン化"
    detail: |
      ## 課題: Director のボトルネック

      現状の Director は2つの全く異なる仕事を直列でやっている:
        1. 戦略業務: Design Debate、タスク設計、Owner との次工程打合せ
        2. 橋渡し業務: Cast レポート処理、マージ判断、次タスク配布

      結果:
        - Phase 開始時に Cast が 15-20分 idle（Director が計画中）
        - 開発中は Director が橋渡しに専念 → 次 Phase の計画ができない
        - Director のコンテキストが全方位の情報で汚染 → コンパクション

      ## 解決策: AD + パイプライン化

      現状（直列）:
        Phase N 計画(20分) → Cast作業 → 橋渡し → Phase N+1 計画(20分) → ...

      提案（並列パイプライン）:
        Phase N 計画 → Cast作業開始 → AD が橋渡し
                                     → Director + Owner で Phase N+1 計画
                                                      → Cast完了 → すぐ N+1 へ

      AD の責務（橋渡し業務の代行）:
        - Cast レポートを読み、要約して Director に渡す（or 自律的に承認）
        - dashboard.md 更新の代行
        - 簡易レビュー（ビルド通るか等の機械的チェック）
        - Cast への次タスク配布（Director が事前に用意した task_pool から）

      Director の責務（戦略業務に集中）:
        - Design Debate 主催
        - Owner との次工程打合せ
        - タスクプール設計
        - 最終的なマージ判断（AD から要約を受けて）

      ## 実装方針

      案1: AD を Task tool + Haiku で都度召喚（軽量・安価）
      案2: AD を tmux 常駐ペインで配置（レスポンス速度重視）

      ## 副次効果

      - Cast Manager（案2）: 将来的に AD 配下で情報圧縮を担当
        - タスク配布時: プロジェクトコンテキストから必要情報だけ抽出して Cast に渡す
        - 完了時: Cast の成果物を圧縮して AD に渡す

      ## コスト判断

      - 時間 > API コスト（Owner の判断）
      - Haiku の要約タスクは安価
      - コンパクション事故の手戻り > AD の運用コスト
      - 待ち時間の解消がプロジェクト全体のスループットを向上

      ## 前提条件

      - checkpoint clear の効果を実戦検証してから最終判断
      - ただし設計は先行して進めてよい（Owner 意向: やりたい）
    impact: high
    status: open
    timestamp: "2026-02-09"

