scale: small  # small: v2モード（Director 1人） / large: v3モード（マルチユニット）

project:
  name: "flare"
  description: >
    F.L.A.R.E. (Flexible List & Automated Research Engine)
    技術ナレッジのWebツール。気になった事を投げる → AIがディープリサーチ →
    結果をスライドやインフォグラフィックで資料化 → リスト構造で保管・閲覧性の高いナレッジ化 → HP公開。
    「未知の技術領域（暗闇）にAIがDeep Researchを投げてパッと照らし出し、視界をクリアにする」
  target_path: null  # 新規プロジェクト。Directorがセットアップする
  tech_stack:
    - "Astro 5.x (Cloudflare買収済み。Islands Architecture)"
    - "Tailwind CSS v4 + shadcn/ui (React Islands)"
    - "Cloudflare Workers + Hono (API)"
    - "Cloudflare D1 (SQLite + FTS5全文検索)"
    - "Cloudflare KV (キャッシュ)"
    - "Cloudflare R2 (生成資料ストレージ)"
    - "Cloudflare Queues (非同期リサーチジョブ)"
    - "Claude API (ディープリサーチ)"
    - "MDX + reveal.js + D3.js (スライド/インフォグラフィック)"
    - "Cloudflare Access (管理画面認証)"
    - "TypeScript"
  priority_features:
    - "Phase 1: プロジェクト初期化 + トップページモック3パターン"
    - "Phase 1: リサーチ投稿 → Claude API呼び出し → 結果保存の基本フロー"
    - "Phase 2: スライド/インフォグラフィック生成・表示"
    - "Phase 2: リスト型ナレッジベースUI"
    - "Phase 3: HP公開・OGP・SEO"
  design:
    direction: "ハイブリッド: B(Precision Tool構造) + C(Warm Modernism肌触り) + A(Editorial見せ場)"
    references:
      - "Linear (https://linear.app) — 情報整理UIの構造"
      - "Stripe Docs (https://docs.stripe.com) — 3カラムドキュメント"
      - "Slab (https://slab.com) — Warm & ミニマル"
      - "Raycast (https://raycast.com) — 引き算のダークUI"
      - "Readymag (https://readymag.com/editorial/) — エディトリアル見せ場"
    principles:
      - "AIっぽさ全開のUI禁止（グラデーション地獄・ネオン・サイバーパンク NG）"
      - "デザイナーが作ったような洗練されたサイト"
      - "構造はLinear/Stripe式、肌触りはWarm Modern、見せ場はEditorial"
      - "ダーク/ライト切替対応"
    phase1_deliverable: "トップページモック3パターン（ブラウザで確認 → Owner選択）"
  casting:
